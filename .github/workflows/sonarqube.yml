name: SonarQube Analysis

on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    # Runs only when secrets are available (instructor org-level; students skip gracefully)
    if: ${{ !github.event.pull_request.head.repo.fork }}
    uses: ebpro/ci-java/.github/workflows/sonarqube-maven.yml@v1.0.0
    with:
      sonar-main-branch: develop
      sonar-host-url: ${{ vars.SONAR_HOST_URL || 'http://sonarqube-sonarqube.sonarqube.svc.cluster.local:9000' }}
      sonar-public-url: ${{ vars.SONAR_PUBLIC_URL || 'https://sonarqube-api.ebruno.fr' }}
      sonar-runner: ${{ vars.SONAR_RUNNER || 'ebpro-org' }}
      build-command: ./mvnw -B clean verify sonar:sonar
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_URL: ${{ secrets.SONAR_URL }}
