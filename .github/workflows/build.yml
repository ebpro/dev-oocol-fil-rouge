name: Build

# Matrice JDK 21 + 25, cœur = ./mvnw verify (compile, teste, couvre, analyse warn-only).
# Adapté du pipeline CI de ebpro/java101-tp1 (versions de plugins validées 21/25).

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Verify (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Ensure mvnw is executable
        run: chmod +x mvnw || true

      - name: Set reproducible build timestamp
        run: echo "BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Display JVM version
        run: java -XshowSettings:properties -version || true

      - name: Build, test and static analysis (warn-only)
        run: ./mvnw -B -Dproject.build.outputTimestamp=${{ env.BUILD_TIMESTAMP }} clean verify

      - name: Upload test reports and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-java-${{ matrix.java }}-${{ github.run_id }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/jacoco.exec
            **/target/site/jacoco/**
          retention-days: 7
          if-no-files-found: warn
